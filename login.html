<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registration Form</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        /* Main container */
        .container {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Form box */
        .form-box {
            width: 700px;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px gray;
        }

        /* Heading */
        h2 {
            text-align: center;
            color: blue;
            margin-bottom: 25px;
        }

        /* Two column row */
        .row {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
        }

        /* Form group */
        .form-group {
            flex: 1;
        }

        /* Label */
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        /* Input and select */
        input[type="text"],
        input[type="email"],
        input[type="password"],
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }

        /* Full width */
        .full {
            margin-bottom: 15px;
        }

        /* City, State, ZIP */
        .city {
            flex: 3;
        }

        .state {
            flex: 2;
        }

        .zip {
            flex: 1;
        }

        /* Terms */
        .terms {
            display: flex;
            align-items: center;
            margin-top: 15px;
            margin-bottom: 20px;
        }

        .terms input {
            margin-right: 8px;
        }

        .terms label {
            margin: 0;
            font-weight: normal;
        }

        /* Button */
        .button-box {
            text-align: center;
        }

        button {
            padding: 10px 50px;
            border: none;
            border-radius: 5px;
            background-color: blue;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: darkblue;
        }

    </style>
</head>


<body>

    <div class="container">

        <div class="form-box">

            <h2>Registration Form</h2>

            <form>

                <!-- First Name and Last Name -->
                <div class="row">

                    <div class="form-group">

                        <label>First Name</label>

                        <input type="text"
                               placeholder="First Name">

                    </div>


                    <div class="form-group">

                        <label>Last Name</label>

                        <input type="text"
                               placeholder="Last Name">

                    </div>

                </div>


                <!-- Email and Password -->
                <div class="row">

                    <div class="form-group">

                        <label>Email</label>

                        <input type="email"
                               placeholder="Enter Email">

                    </div>


                    <div class="form-group">

                        <label>Password</label>

                        <input type="password"
                               placeholder="Enter Password">

                    </div>

                </div>


                <!-- Address -->
                <div class="form-group full">

                    <label>Address</label>

                    <input type="text"
                           placeholder="123 Main Street">

                </div>


                <!-- Address 2 -->
                <div class="form-group full">

                    <label>Address 2</label>

                    <input type="text"
                           placeholder="Apartment, Studio, or Floor">

                </div>


                <!-- City, State, ZIP -->
                <div class="row">

                    <div class="form-group city">

                        <label>City</label>

                        <input type="text"
                               placeholder="City">

                    </div>


                    <div class="form-group state">

                        <label>State</label>

                        <select>

                            <option selected>Select State</option>

                            <option>Tamil Nadu</option>

                            <option>Kerala</option>

                            <option>Karnataka</option>

                            <option>Andhra Pradesh</option>

                        </select>

                    </div>


                    <div class="form-group zip">

                        <label>ZIP</label>

                        <input type="text"
                               placeholder="ZIP">

                    </div>

                </div>


                <!-- Terms and Conditions -->
                <div class="terms">

                    <input type="checkbox" id="check">

                    <label for="check">
                        I agree to the Terms & Conditions
                    </label>

                </div>


                <!-- Register Button -->
                <div class="button-box">

                    <button type="submit">
                        Register
                    </button>

                </div>

            </form>

        </div>

    </div>

</body>

</html>
