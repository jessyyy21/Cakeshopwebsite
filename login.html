<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Registration Form</title>


    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #f3e8ff);
        }


        /* Main container */

        .container {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;
        }


        /* Form box */

        .form-box {
            width: 700px;
            max-width: 100%;

            background-color: white;

            padding: 35px;

            border-radius: 15px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }


        /* Heading */

        h2 {
            text-align: center;

            color: #2563eb;

            margin-top: 0;
            margin-bottom: 30px;
        }


        /* Row */

        .row {
            display: flex;

            gap: 20px;

            margin-bottom: 18px;
        }


        /* Form group */

        .form-group {
            flex: 1;
        }


        /* Label */

        label {
            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            color: #333;
        }


        /* Input and Select */

        input[type="text"],
        input[type="email"],
        input[type="password"],
        select {
            width: 100%;

            padding: 11px;

            border: 1px solid #ccc;

            border-radius: 7px;

            font-size: 14px;

            outline: none;

            transition: 0.3s;
        }


        /* Input focus */

        input:focus,
        select:focus {
            border-color: #2563eb;

            box-shadow: 0 0 5px rgba(37, 99, 235, 0.3);
        }


        /* Full width */

        .full {
            margin-bottom: 18px;
        }


        /* Terms */

        .terms {
            display: flex;

            align-items: center;

            gap: 8px;

            margin-top: 20px;

            margin-bottom: 20px;
        }


        .terms label {
            margin: 0;

            font-weight: normal;
        }


        /* Button */

        .button-box {
            text-align: center;
        }


        button {
            width: 200px;

            padding: 12px;

            border: none;

            border-radius: 7px;

            background-color: #2563eb;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }


        button:hover {
            background-color: #1d4ed8;

            transform: translateY(-2px);
        }


        /* Error message */

        .error {
            color: red;

            font-size: 13px;

            margin-top: 5px;
        }


        /* Success message */

        .success {
            color: green;

            text-align: center;

            font-weight: bold;

            margin-top: 20px;
        }


        /* Mobile */

        @media (max-width: 600px) {

            .form-box {
                padding: 25px;
            }

            .row {
                flex-direction: column;

                gap: 0;

                margin-bottom: 0;
            }

            .form-group {
                margin-bottom: 18px;
            }

            button {
                width: 100%;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <div class="form-box">


        <h2>Registration Form</h2>


        <form id="registrationForm">


            <!-- First Name and Last Name -->

            <div class="row">


                <div class="form-group">

                    <label for="firstName">
                        First Name
                    </label>

                    <input type="text"
                           id="firstName"
                           placeholder="First Name">

                    <p id="firstNameError"
                       class="error"></p>

                </div>


                <div class="form-group">

                    <label for="lastName">
                        Last Name
                    </label>

                    <input type="text"
                           id="lastName"
                           placeholder="Last Name">

                    <p id="lastNameError"
                       class="error"></p>

                </div>


            </div>


            <!-- Email and Password -->

            <div class="row">


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input type="email"
                           id="email"
                           placeholder="Enter Email">

                    <p id="emailError"
                       class="error"></p>

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input type="password"
                           id="password"
                           placeholder="Enter Password">

                    <p id="passwordError"
                       class="error"></p>

                </div>


            </div>


            <!-- Address -->

            <div class="form-group full">

                <label for="address">
                    Address
                </label>

                <input type="text"
                       id="address"
                       placeholder="123 Main Street">

                <p id="addressError"
                   class="error"></p>

            </div>


            <!-- Address 2 -->

            <div class="form-group full">

                <label for="address2">
                    Address 2
                </label>

                <input type="text"
                       id="address2"
                       placeholder="Apartment, Studio, or Floor">

            </div>


            <!-- City State ZIP -->

            <div class="row">


                <div class="form-group">

                    <label for="city">
                        City
                    </label>

                    <input type="text"
                           id="city"
                           placeholder="City">

                    <p id="cityError"
                       class="error"></p>

                </div>


                <div class="form-group">

                    <label for="state">
                        State
                    </label>

                    <select id="state">

                        <option value="">
                            Select State
                        </option>

                        <option>
                            Tamil Nadu
                        </option>

                        <option>
                            Kerala
                        </option>

                        <option>
                            Karnataka
                        </option>

                        <option>
                            Andhra Pradesh
                        </option>

                    </select>

                    <p id="stateError"
                       class="error"></p>

                </div>


                <div class="form-group">

                    <label for="zip">
                        ZIP
                    </label>

                    <input type="text"
                           id="zip"
                           placeholder="ZIP">

                    <p id="zipError"
                       class="error"></p>

                </div>


            </div>


            <!-- Terms -->

            <div class="terms">

                <input type="checkbox"
                       id="check">

                <label for="check">
                    I agree to the Terms & Conditions
                </label>

            </div>

            <p id="termsError"
               class="error"></p>


            <!-- Button -->

            <div class="button-box">

                <button type="submit">
                    Register
                </button>

            </div>


            <p id="successMessage"
               class="success"></p>


        </form>


    </div>

</div>


<script>

    document.getElementById("registrationForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();


            // Clear previous errors

            document.getElementById("firstNameError").innerHTML = "";
            document.getElementById("lastNameError").innerHTML = "";
            document.getElementById("emailError").innerHTML = "";
            document.getElementById("passwordError").innerHTML = "";
            document.getElementById("addressError").innerHTML = "";
            document.getElementById("cityError").innerHTML = "";
            document.getElementById("stateError").innerHTML = "";
            document.getElementById("zipError").innerHTML = "";
            document.getElementById("termsError").innerHTML = "";
            document.getElementById("successMessage").innerHTML = "";


            // Get values

            let firstName =
                document.getElementById("firstName").value.trim();

            let lastName =
                document.getElementById("lastName").value.trim();

            let email =
                document.getElementById("email").value.trim();

            let password =
                document.getElementById("password").value.trim();

            let address =
                document.getElementById("address").value.trim();

            let city =
                document.getElementById("city").value.trim();

            let state =
                document.getElementById("state").value;

            let zip =
                document.getElementById("zip").value.trim();

            let check =
                document.getElementById("check").checked;


            let valid = true;


            // First name validation

            if (firstName === "") {

                document.getElementById("firstNameError")
                    .innerHTML = "Please enter first name";

                valid = false;
            }


            // Last name validation

            if (lastName === "") {

                document.getElementById("lastNameError")
                    .innerHTML = "Please enter last name";

                valid = false;
            }


            // Email validation

            if (email === "") {

                document.getElementById("emailError")
                    .innerHTML = "Please enter email";

                valid = false;

            } else if (!email.includes("@")) {

                document.getElementById("emailError")
                    .innerHTML = "Please enter a valid email";

                valid = false;
            }


            // Password validation

            if (password === "") {

                document.getElementById("passwordError")
                    .innerHTML = "Please enter password";

                valid = false;

            } else if (password.length < 6) {

                document.getElementById("passwordError")
                    .innerHTML =
                    "Password must contain at least 6 characters";

                valid = false;
            }


            // Address validation

            if (address === "") {

                document.getElementById("addressError")
                    .innerHTML = "Please enter address";

                valid = false;
            }


            // City validation

            if (city === "") {

                document.getElementById("cityError")
                    .innerHTML = "Please enter city";

                valid = false;
            }


            // State validation

            if (state === "") {

                document.getElementById("stateError")
                    .innerHTML = "Please select state";

                valid = false;
            }


            // ZIP validation

            if (zip === "") {

                document.getElementById("zipError")
                    .innerHTML = "Please enter ZIP";

                valid = false;
            }


            // Terms validation

            if (!check) {

                document.getElementById("termsError")
                    .innerHTML =
                    "Please agree to the Terms & Conditions";

                valid = false;
            }


            // Success

            if (valid) {

                document.getElementById("successMessage")
                    .innerHTML =
                    "Registration successful!";

            }

        });

</script>


</body>

</html>
