<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login Form</title>


    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            font-family: Arial, sans-serif;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background: linear-gradient(135deg, #dbeafe, #e0e7ff);
        }


        .container {
            width: 380px;

            max-width: 90%;

            background-color: white;

            padding: 35px;

            border-radius: 18px;

            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
        }


        .logo {
            width: 70px;

            height: 70px;

            margin: 0 auto 15px;

            display: flex;

            justify-content: center;

            align-items: center;

            border-radius: 50%;

            background-color: #2563eb;

            color: white;

            font-size: 32px;
        }


        h2 {
            text-align: center;

            margin: 0;

            color: #1e3a8a;

            font-size: 28px;
        }


        .subtitle {
            text-align: center;

            color: #777;

            font-size: 14px;

            margin-bottom: 30px;
        }


        .form-group {
            margin-bottom: 20px;
        }


        label {
            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            color: #333;
        }


        input[type="email"],
        input[type="password"] {

            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 15px;

            outline: none;
        }


        input:focus {

            border-color: #2563eb;

            box-shadow: 0 0 5px rgba(37, 99, 235, 0.3);
        }


        .terms {

            display: flex;

            align-items: center;

            gap: 8px;

            margin-bottom: 25px;

            font-size: 14px;
        }


        .terms input {

            width: 16px;

            height: 16px;

            cursor: pointer;
        }


        .terms label {

            margin: 0;

            font-weight: normal;

            color: #555;
        }


        button {

            width: 100%;

            padding: 12px;

            border: none;

            border-radius: 8px;

            background-color: #2563eb;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }


        button:hover {

            background-color: #1d4ed8;
        }


        .error {

            color: red;

            text-align: center;

            font-size: 14px;

            margin-top: 15px;
        }


        .bottom-text {

            text-align: center;

            margin-top: 25px;

            font-size: 14px;

            color: #777;
        }


        .bottom-text a {

            color: #2563eb;

            text-decoration: none;

            font-weight: bold;
        }


        .bottom-text a:hover {

            text-decoration: underline;
        }

    </style>

</head>


<body>


    <div class="container">


        <div class="logo">
            🔐
        </div>


        <h2>Login Form</h2>


        <p class="subtitle">
            Welcome back! Please sign in to continue.
        </p>


        <form onsubmit="goToIndex(event)">


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input type="email"
                       id="email"
                       placeholder="Enter your email"
                       required>

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input type="password"
                       id="password"
                       placeholder="Enter your password"
                       required>

            </div>


            <div class="terms">

                <input type="checkbox"
                       id="terms"
                       required>

                <label for="terms">
                    I agree to the Terms and Conditions
                </label>

            </div>


            <button type="submit">
                Sign In
            </button>


            <p id="errorMessage"
               class="error">
            </p>


        </form>


        <p class="bottom-text">

            New user?

            <a href="login.html">
                Create an account
            </a>

        </p>


    </div>


    <script>

        function goToIndex(event) {

            event.preventDefault();

            let email =
                document.getElementById("email").value;

            let password =
                document.getElementById("password").value;


            // Get registered details from localStorage

            let savedEmail =
                localStorage.getItem("email");

            let savedPassword =
                localStorage.getItem("password");


            // Check login details

            if (email === savedEmail &&
                password === savedPassword) {

                // Successful login

                window.location.href = "index.html";

            }

            else {

                document.getElementById("errorMessage")
                    .innerHTML =
                    "Invalid email or password";

            }

        }

    </script>


</body>

</html>
