<!DOCTYPE html>
<html>

<head>
    <title>Login Form</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .container {
            width: 350px;
            margin: 100px auto;
            padding: 30px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .terms {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .terms input {
            margin-right: 8px;
        }

        .terms label {
            margin: 0;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: darkblue;
        }

    </style>
</head>

<body>

    <div class="container">

        <h2>Login Form</h2>

        <form onsubmit="goToIndex(event)">

            <label for="email">Email</label>
            <input type="email" id="email" required>

            <label for="password">Password</label>
            <input type="password" id="password" required>

            <div class="terms">

                <input type="checkbox" id="terms" required>

                <label for="terms">
                    I agree to the Terms and Conditions
                </label>

            </div>

            <button type="submit">
                Sign in
            </button>

        </form>

    </div>


    <script>

        function goToIndex(event) {

            event.preventDefault();

            window.location.href = "index.html";

        }

    </script>

</body>

</html>
